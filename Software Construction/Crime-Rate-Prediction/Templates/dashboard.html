<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Rate Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container dashboard-container">
        <h2>Crime Rate Dashboard</h2>
        <p class="subtitle">Enter a year to predict the crime rate.</p>
        <form action="/predict" method="post">
            <input type="number" name="year" min="2000" max="2050" placeholder="Enter Year" required>
            <button type="submit">Predict</button>
        </form>
        <a class="button secondary" href="/">Logout</a>
    </div>
</body>
</html>
